name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vectors:
    # self-hosted runner: never run code from a fork
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: homelab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: Akoma Ntoso schema validation
        run: uv run pytest tests/test_akn_profile.py

      - name: Reference validator (XSD, Schematron, sidecar schema)
        run: uv run python validator/validate.py

      - name: pytest
        run: uv run pytest --ignore=tests/test_akn_profile.py
