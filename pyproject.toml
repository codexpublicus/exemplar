[project]
name = "exemplar-checks"
version = "0.0.0"
description = "Conformance checks for the exemplar specs and test vectors"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "abnf>=2.2",
    "jsonschema>=4.23",
    "lxml>=5.3",
    "pytest>=8",
    "ruff>=0.6",
    "saxonche~=13.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
